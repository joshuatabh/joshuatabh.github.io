# Site configuration
# 1. Files excluded from Jekyll builds
# 2. Installed Gems
# 3. Gem settings
# 4. Jekyll settings
# 5. Collections
# 6. Jekyll collections settings
# 7. Site settings
# 8. Site favicons & manifest icons
# 9. Site navigation

# 1. Files excluded from Jekyll builds
exclude:
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - screenshot.png
  - LICENSE
  - CNAME
  - Gemfile
  - Gemfile.lock
  - alembic-jekyll-theme.gemspec
  - .jekyll-cache

# 2. Installed Gems
plugins:
  - jekyll-sitemap
  - jekyll-mentions
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-commonmark
  - jekyll-include-cache
  - jemoji

# 3. Gem settings
paginate: 2 # jekyll-paginate > items per page
paginate_path: blog/page:num # jekyll-paginate > blog page
jekyll-mentions: https://twitter.com # jekyll-mentions > service used when @replying
twitter:
  username: JoshuaTabh
author: Joshua Tabh
social: # jekyll-seo-tag > social overrides
  name: Joshua Tabh # jekyll-seo-tag > real name
  links: # jekyll-seo-tag > social aliases (sameAs)
    - https://twitter.com/JoshuaTabh
    - https://portal.research.lu.se/en/persons/joshua-tabh
    - https://www.researchgate.net/profile/Joshua-Tabh
# markdown: CommonMark # Markdown parse settings, CommonMark performs slightly better an others in build time
# commonmark:
# options: ["SMART", "FOOTNOTES"]
# extensions: ["strikethrough", "autolink", "table"]

# 4. Jekyll settings
sass:
  style: compressed # Style compression
permalink: pretty # Permalink style (/YYYY/MM/DD/page-name/)
excerpt_separator: <!-- more --> # Marks end of excerpt in posts
timezone: Europe/Copenhagen # Timezone for blog posts and alike

# 5. Collections
#collections:
#  posts:
#    title: Posts # Needed for Siteleaf
#    output: true
#    description: "Posts" # The post list page content
#    feature_image: "/assets/banner/cabinDreamlike.png"

# 6. Jekyll collections settings
defaults:
  - scope:
      path: ""
    values:
      image: "/assets/banner/cabinDreamlike.png" # Default image for sharing
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post # Set the default layout for posts
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages

# 7. Site settings
encoding: utf-8 # Make sure the encoding is right
lang: en-GB # Set the site language
title: "Joshua Tabh" # Site name or title, also used in jekyll-seo-tag
logo: "/assets/logos/logo.png" # Site logo, also used in jekyll-seo-tag
baseurl: ""
email: "joshua.k.tabh@biol.lu.se"
# disqus: "alembic-1" # Blog post comments, uncomment the option and set the site ID from your Disqus account
# date_format: "%-d %B %Y" # Blog post date formatting using placeholder formatting
# google_analytics: ""
# google_analytics_anonymize_ip: ""
# service_worker: false # Will turn off the service worker if set to false
# short_name: "Al" # The web application short name, defaults to the site title
css_inline: true # Will insert all styles into a single <style> block in the <head> element and remove the style <link> reference

# 8. Site favicons & manifest icons
favicons: # Favicons are also used in the manifest file. Syntax is 'size: path'
  16: "/assets/logos/logo@240pxTest.svg"
  32: "/assets/logos/logo@240pxTest.svg"
  96: "/assets/logos/logo@240pxTest.svg"
  120: "/assets/logos/logo@240pxTest.svg"
  144: "/assets/logos/logo@240pxTest.svg"
  180: "/assets/logos/logo@240pxTest.svg"
  512: "/assets/logos/logo@512pxTest.svg"
  1024: "/assets/logos/logo@1024pxTest.svg"

# 9. Site navigation
navigation_header:
  - title: Home
    url: /
  - title: Current Projects
    url: /research/
  - title: Writing
    url: /writing/
  - title: About
    url: /about/
    children:
      - title: "Joshua Tabh"
        url: /about/joshuatabh/
      - title: "CV"
        url: /about/CV/

navigation_footer:
  - title: Research Portal at Lund University
    url: https://portal.research.lu.se/en/persons/joshua-tabh

social_links: # Appears in sidebar. Set the urls then uncomment and comment out as desired
  Twitter: https://twitter.com/JoshuaTabh
  ResearchGate: https://www.researchgate.net/profile/Joshua-Tabh
  link: https://portal.research.lu.se/en/persons/joshua-tabh

sharing_links: # Appear at the bottom of single blog posts, add as desired. The value can be 'true' or the desired button colour
  Twitter: "#0d94e7"
  facebook: "#3B5998"
  Email: true

# Load custom fonts from fonts.google.com etc
#
# TIP: Try to keep the number of urls as low to reduce the performance cost
#      If multiple fonts can be requested in a single url opt for this
fonts:
  preconnect_urls:
    - https://fonts.gstatic.com
  font_urls:
    - https://fonts.googleapis.com/css2?family=Playfair:wght@400;700&display=swap
