<header class="header{% if page.homepage %} header--homepage{% endif %}">
  <div class="container">
    {% if site.logo %}
    {% if page.homepage %}
    <a href="{{ '/' | relative_url }}" class="logo">
      <img src="{{ '/assets/logos/logo-white.png' | relative_url }}" alt="{{ site.title }} logo">
    </a>
    {% else %}

    {% endif %}

  </div>

  {% include site-feature-main.html %}
